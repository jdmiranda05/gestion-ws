<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mesa de Ayuda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <div class="offcanvas-lg offcanvas-start sidebar-envoltura" tabindex="-1" id="sidebar">
        <aside class="sidebar">
            <div class="marca"><span class="marca-logo"><i class="bi bi-headset"></i></span> Mesa de Ayuda</div>
            <nav class="menu" id="menu"></nav>
            <div class="usuario-caja">
                <div class="avatar" id="usuario-avatar"></div>
                <div class="flex-grow-1 min-w-0">
                    <div class="nombre text-truncate" id="usuario-nombre"></div>
                    <div class="rol" id="usuario-rol"></div>
                </div>
                <button class="btn btn-sm text-secondary p-1" id="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </div>
        </aside>
    </div>

    <div class="principal">
        <header class="barra-superior">
            <button class="btn btn-light d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Abrir menú">
                <i class="bi bi-list fs-5"></i>
            </button>
            <h1 id="titulo-pagina"></h1>

            <div class="dropdown">
                <button class="btn btn-light position-relative" data-bs-toggle="dropdown" data-bs-auto-close="outside" id="btn-avisos" aria-label="Notificaciones">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="badge rounded-pill bg-danger campana-badge d-none" id="avisos-contador"></span>
                </button>
                <div class="dropdown-menu dropdown-menu-end menu-avisos shadow">
                    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                        <strong>Notificaciones</strong>
                        <button class="btn btn-link btn-sm p-0" id="avisos-leer">Marcar todas como leídas</button>
                    </div>
                    <div class="avisos-lista" id="avisos-lista"></div>
                </div>
            </div>
        </header>

        <main class="contenido" id="contenido"></main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
